name: Bug report
description: Something Strider does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead, with the full error.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest program that shows it.
      render: ts
    validations:
      required: true
  - type: input
    id: strider
    attributes:
      label: Strider version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: "`npx strider browsers` lists them, e.g. Chromium 155.0.8059.79."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and runtime
      placeholder: Linux, Node 24

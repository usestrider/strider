# The standard checks, on every pull request and every push to main: in the Nix environment's
# default shell, so Node and pnpm are the pinned ones, as on a maintainer's machine. As in
# Effect's CI, a branch is checked once it has a pull request, at its head: the commits it
# gathers before then, a failing test ahead of its fix among them, aren't run on their own,
# and each push to a pull request's branch runs once.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Install
        run: nix develop --command pnpm install --frozen-lockfile
      # The type check and the generated code's, the linters, the standard tests, the type tests and the API
      # reference's checks
      - name: pnpm all
        run: nix develop --command pnpm all
      # The published packages, built, packed and installed in a project of their own
      - name: Build
        run: nix develop --command pnpm build
      - name: Package checks
        run: nix develop --command pnpm pack-check

# The browser integration tests: every night and on demand. They run in `devShells.integration`,
# a file at a time, as on a maintainer's machine, with the browsers the flake pins, from the Nix binary cache.
name: Integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      macos-diagnostics:
        description: Run only the macOS suite once and retain native crash diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ inputs.macos-diagnostics != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      # Ubuntu 24.04 restricts unprivileged user namespaces to programs AppArmor names, and Chromium's and Firefox's
      # sandboxes need them: the Nix store's browsers aren't named
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: nix develop --command pnpm install --frozen-lockfile
      # Ubuntu's core handler is given a fixed huge limit, whatever the process's own, so a crashed renderer stays
      # dumping past the crash tests' deadlines: %c gives it the real one
      - name: Respect core limits
        run: |
          sudo sysctl -w "kernel.core_pattern=$(sed 's/ 9223372036854775808 / %c /' /proc/sys/kernel/core_pattern)"
          cat /proc/sys/kernel/core_pattern
      - name: Build the documentation for layout tests
        run: nix develop --command pnpm website:dist
      - name: Integration tests
        run: nix develop --command pnpm test:integration --no-file-parallelism 2>&1 | tee integration.log
      # Failure-only protocol and owned browser process traces accompany the log.
      - name: Keep the log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log
          path: |
            integration.log
            .data/integration-failures/
          include-hidden-files: true
          retention-days: 14

  integration-macos:
    # Run independently of Linux; respect workflow cancellation.
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Without this, setup-node caches the packageManager's store, which needs pnpm before it's installed
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.9.0
      - name: Install TLS fixture tool
        run: brew install openssl@3
      - name: Install
        run: pnpm install --frozen-lockfile
      # No AppArmor, /proc core handler or Xvfb on macOS. Headed cases use WindowServer.
      # The entry point verifies pinned browser, ffmpeg and ffprobe downloads before running real video tests.
      - name: Start native crash report capture
        if: inputs.macos-diagnostics
        run: node scripts/macos-crash-reports.mjs start
      - name: Install verified macOS browsers and video tools, then run integration tests
        id: macos-suite
        env:
          STRIDER_MACOS_WORKER_DIAGNOSTICS: ${{ inputs.macos-diagnostics && '1' || '' }}
        run: pnpm test:integration:macos --no-file-parallelism 2>&1 | tee integration-macos.log
      - name: Collect native crash reports
        if: always() && inputs.macos-diagnostics
        env:
          STRIDER_MACOS_SUITE_OUTCOME: ${{ steps.macos-suite.outcome }}
        run: node scripts/macos-crash-reports.mjs finish
      - name: Keep the macOS log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-macos-log
          path: |
            integration-macos.log
            .data/macos-crash-reports/
            .data/integration-failures/
          include-hidden-files: true
          retention-days: 14

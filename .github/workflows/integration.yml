# The browser integration tests: nightly when `main` has changed since the last run, and
# on demand. They run in `devShells.integration`, a file at a time, as on a maintainer's machine, with the browsers
# the flake pins, from the Nix binary cache.
name: Integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      # A scheduled run is skipped where the last run of this workflow, whatever its outcome, tested the same commit
      - id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow integration.yml --branch main --limit 20 \
            --json databaseId,headSha,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and .status == \"completed\")][0].headSha // \"\"")
          if [ "$last" = "$SHA" ]; then
            echo "main is at $SHA, which the last run tested"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      # Ubuntu 24.04 restricts unprivileged user namespaces to programs AppArmor names, and Chromium's and Firefox's
      # sandboxes need them: the Nix store's browsers aren't named
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Integration tests
        run: bash scripts/integration-core-policy.sh -- nix develop --command pnpm test:integration --no-file-parallelism 2>&1 | tee integration.log
      # Failure-only protocol and owned browser process traces accompany the log.
      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log
          path: |
            integration.log
            .data/integration-failures/
          include-hidden-files: true
          retention-days: 14

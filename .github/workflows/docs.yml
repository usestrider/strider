# The documentation site, deployed to Cloudflare from main (website/alchemy.run.ts): in the Nix environment's
# default shell, as the checks run. Its settings, the Cloudflare token and account among them, are in
# website/deploy.sops.env, which the SOPS_AGE_KEY secret, the deploy's own age key, decrypts (.sops.yaml). The secret
# belongs to the docs-deploy environment, which only main can use, so no other branch's workflow can read it.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never one cut off halfway
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: docs-deploy
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      # Fails the run, before the install, if the settings don't decrypt or the token isn't in them
      - name: Check for the token
        run: nix develop --command sops exec-env website/deploy.sops.env 'test -n "${CLOUDFLARE_API_TOKEN:-}"'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Install
        run: nix develop --command pnpm install --frozen-lockfile
      # Builds the API reference and the site, then deploys what changed
      - name: Deploy
        run: nix develop --command pnpm website:deploy
        env:
          CI: "true"
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

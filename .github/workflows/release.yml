# Publishes to npm, on demand, the versions on main that npm doesn't have yet, in the Nix environment's default shell,
# as the checks run. To release: run `pnpm changeset version` in a pull request and merge it, then run this workflow.
# The npm-publish environment takes only main, and waits for the maintainer's approval.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never one cut off halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 30
    permissions:
      # To push the release's tags
      contents: write
      # To sign in to npm as this workflow, and to sign the packages' provenance
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Install
        run: nix develop --command pnpm install --frozen-lockfile
      # Signs in as this workflow, npm's trusted publisher for each package. npm can't trust a workflow for a package it
      # doesn't have yet, so a new package's first version is published by hand, with `pnpm release` too: `changeset
      # publish` alone packs whatever build is on disk.
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nix develop --command pnpm release
      - name: Push the tags
        run: git push origin --tags

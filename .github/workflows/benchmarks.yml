# Run on demand while establishing targets; performance failures are opt-in because
# hosted runner load varies. Correctness failures always fail the job.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref
        type: string
        default: main
      head:
        description: Head ref (empty uses dispatched branch)
        type: string
      workload:
        description: Workload
        type: choice
        options: [bench, scenarios]
        default: bench
      only:
        description: Case or group (required for scenarios)
        type: string
      browser:
        description: Browser (currently Chromium only)
        type: choice
        options: [chromium]
        default: chromium
      runs:
        description: Measured repetitions (multiple of 4, 4..1000)
        type: string
        default: "20"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    # Holds SOPS_AGE_KEY, the benchmarks' own age key, which decrypts only the recordings bucket's keys (.sops.yaml)
    environment: benchmarks
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          path: .paired/base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head || github.ref }}
          path: .paired/head
      - name: Install and build isolated refs
        run: |
          set -euo pipefail
          mkdir -p .data/paired
          git rev-parse HEAD > .data/paired/driver-commit.txt
          for role in base head; do
            git -C ".paired/$role" rev-parse HEAD > ".data/paired/$role-commit.txt"
            (cd ".paired/$role" && nix develop --command pnpm install --frozen-lockfile && nix develop --command pnpm build) 2>&1 | tee ".data/paired/$role-build.log"
          done
          nix develop --command pnpm install --frozen-lockfile
      - name: Recordings bucket keys
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          # A driver without the encrypted keys runs the real-site scenarios only if their recordings are on the runner
          if [ ! -f packages/scenarios/recordings.sops.env ]; then exit 0; fi
          keys="$RUNNER_TEMP/recordings.env"
          nix develop --command sops -d --output-type dotenv packages/scenarios/recordings.sops.env > "$keys"
          while IFS='=' read -r name value; do
            [ -n "$name" ] || continue
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < "$keys"
          rm -f "$keys"
      - name: Paired comparison
        env:
          WORKLOAD: ${{ inputs.workload }}
          ONLY: ${{ inputs.only }}
          BROWSER: ${{ inputs.browser }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          args=(--base "$PWD/.paired/base" --head "$PWD/.paired/head" --output "$PWD/.data/paired" --workload "$WORKLOAD" --browser "$BROWSER" --runs "$RUNS")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          nix develop .#integration --ignore-environment --keep TERM --keep STRIDER_RECORDINGS_ACCOUNT_ID --keep STRIDER_RECORDINGS_BUCKET --keep STRIDER_RECORDINGS_ACCESS_KEY_ID --keep STRIDER_RECORDINGS_SECRET_ACCESS_KEY --command node packages/scenarios/src/benchmarks/compare-bin.ts "${args[@]}" 2>&1 | tee .data/paired/driver.log
      - name: Job summary
        if: always()
        run: |
          if [ -f .data/paired/summary.md ]; then
            cat .data/paired/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No valid comparison: setup or driver failed before producing a summary. See retained logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            .data/paired/
          include-hidden-files: true
          retention-days: 30
